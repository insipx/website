[package]
name = "website-srv"
version = "0.1.0"
edition = "2024"

[dependencies]
lexopt = "0.3.2"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-loki = { version = "0.2", default-features = false, features = [
  "rustls",
  "compat-0-2-1",
] }
warp = { version = "0.4.3", features = ["server"] }
simple-eyre = "0.3"
url = "2.5"
tracing-opentelemetry = "0.33.0"
http = "1.5"
