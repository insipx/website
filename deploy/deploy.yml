apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: insipx
  template:
    metadata:
      labels:
        app: insipx
    spec:
      # The server never talks to the API; don't hand it a token.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: ghcr.io/insipx/website
          name: website
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
