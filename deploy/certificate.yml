---
# ACME via cert-manager, HTTP-01. cert-manager creates a temporary Ingress for
# /.well-known/acme-challenge/<token>; traefik serves it on `web` (port 80),
# which outranks the HostRegexp(.+) https-redirect (priority 1). Port 80 must
# reach traefik from the internet.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: insipx-xyz
  namespace: website
spec:
  secretName: insipx-xyz-tls
  dnsNames:
    - insipx.xyz
    - www.insipx.xyz
  issuerRef:
    # Start on staging (no rate limits). Flip to `letsencrypt` once READY.
    name: letsencrypt-staging
    kind: ClusterIssuer
