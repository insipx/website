---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: website
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Ingress: traefik
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: website
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
---
## No egress policies: the site makes no outbound calls, so default-deny
## covers egress entirely.
##
## Egress: push logs to loki via its gateway.
## Only needed if the app ships logs itself. If alloy is instead configured to
## scrape pod stdout, delete this policy -- that traffic flows inward.
## Re-enabling this also needs an allow-dns egress policy (kube-dns, 53/udp+tcp).
