name: image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: insipx
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix build .#image

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          docker load < result
          docker tag ghcr.io/insipx/website:main ghcr.io/insipx/website:${{ github.sha }}
          docker push ghcr.io/insipx/website:${{ github.sha }}
          docker push ghcr.io/insipx/website:main
