name: image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            package: image-x86_64
          - arch: arm64
            package: image-aarch64
    steps:
      - uses: actions/checkout@v5

      - uses: nixbuild/nix-quick-install-action@v34
        with:
          nix_conf: |
            extra-substituters = https://insipx.cachix.org
            extra-trusted-public-keys = insipx.cachix.org-1:JMvQq3zItXN5AO7VfPUAILAwMXQrzQ78rLoQTktWs14=

      - uses: cachix/cachix-action@v17
        with:
          name: insipx
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix build .#${{ matrix.package }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          docker load < result
          docker tag ghcr.io/insipx/website:main ghcr.io/insipx/website:${{ github.sha }}-${{ matrix.arch }}
          docker push ghcr.io/insipx/website:${{ github.sha }}-${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          for tag in main ${{ github.sha }}; do
            docker buildx imagetools create -t ghcr.io/insipx/website:$tag \
              ghcr.io/insipx/website:${{ github.sha }}-amd64 \
              ghcr.io/insipx/website:${{ github.sha }}-arm64
          done
